<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BJJフロー">
<meta name="theme-color" content="#14161a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>BJJフロー</title>
<style>
:root{--bg:#14161a;--panel:#1d2026;--panel2:#262a32;--line:#3a3f4a;--text:#e9ecf1;--sub:#9aa3b2;--accent:#4f8cff;--danger:#ff5d5d;--safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
button:active{filter:brightness(1.3)}
button:disabled{opacity:.35}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.danger{color:var(--danger)}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
button.sm{padding:6px 10px;font-size:13px;border-radius:8px}
input[type=text],input[type=tel],textarea,select{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;-webkit-user-select:text;user-select:text}
textarea{min-height:90px;resize:vertical}
input:disabled,textarea:disabled,select:disabled{opacity:.6}
.view{position:fixed;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
header{display:flex;align-items:center;gap:6px;padding:calc(var(--safe-t) + 8px) 10px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{flex:1;margin:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
header button{padding:7px 11px}
#list{flex:1;overflow:auto;padding:12px 12px calc(var(--safe-b) + 24px)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tools button{padding:12px 6px;font-size:14px}
.card{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.card .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{color:var(--sub);font-size:12px}
.fh{color:var(--sub);font-size:13px;margin:14px 2px 8px;padding:4px 0}
.foot{color:var(--sub);font-size:12px;line-height:1.6;margin-top:18px}
#canvas{flex:1;position:relative;overflow:hidden;touch-action:none;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:24px 24px}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
.node{position:absolute;width:140px;min-height:48px;background:var(--panel2);border:1px solid var(--line);border-left:6px solid var(--c,#4f8cff);border-radius:10px;padding:8px 10px;font-size:14px;line-height:1.35;box-shadow:0 2px 8px #0006;touch-action:none;-webkit-touch-callout:none}
.node.pill{border-radius:26px;padding-left:14px}
.node .pic{display:block;width:100%;height:64px;object-fit:cover;border-radius:6px;margin-bottom:6px;background:#000;pointer-events:none;-webkit-user-drag:none}
.node .ic{font-size:11px;color:var(--sub);margin-top:3px}
.node .ms{position:absolute;top:6px;right:6px;width:10px;height:10px;border-radius:50%;border:2px solid #0008;background:#6b7280}
.node .ms.m1{background:#f5a524}.node .ms.m2{background:#3ecf8e}
.node.sel{outline:2px solid #fff}
.node.from{outline:2px dashed var(--accent)}
.node.dim{opacity:.2}
.node.dimw{opacity:.4}
.node.flash{animation:fl .5s ease 4}
@keyframes fl{50%{outline:3px solid #fff}}
#banner{position:absolute;left:12px;right:12px;top:10px;background:var(--accent);color:#fff;border-radius:10px;padding:10px;font-size:14px;text-align:center;display:none;z-index:5}
#fab{position:absolute;right:16px;bottom:calc(var(--safe-b) + 20px);z-index:4;border-radius:28px;padding:14px 20px;box-shadow:0 4px 14px #0008}
#fit{position:absolute;left:16px;bottom:calc(var(--safe-b) + 20px);z-index:4;border-radius:28px;padding:14px 16px}
.edge-hit{stroke:transparent;stroke-width:26;fill:none;cursor:pointer}
.edge-line{stroke:#aab3c5;stroke-width:2;fill:none;pointer-events:none}
.edge-lbl{fill:var(--text);font-size:12px;paint-order:stroke;stroke:var(--bg);stroke-width:5px;text-anchor:middle;pointer-events:none}
#shade{position:fixed;inset:0;background:#0008;display:none;z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:90%;overflow:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(var(--safe-b) + 20px);display:none;z-index:21;-webkit-overflow-scrolling:touch}
#sheet .row{margin-bottom:16px}
#sheet label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns a{text-decoration:none}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:9px 4px;font-size:13px}
.chips{display:flex;gap:10px}
.chip{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.chip.on{border-color:#fff}
video{width:100%;max-height:44vh;background:#000;border-radius:10px}
.vname{font-size:12px;color:var(--sub);margin:6px 0;line-height:1.5}
.box{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}
.box .t{font-size:14px;margin-bottom:6px;word-break:break-all}
.cover{width:100%;height:170px;object-fit:cover;border-radius:10px;background:#000;display:block;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.grid img{width:100%;height:86px;object-fit:cover;border-radius:8px;background:#000}
.gd{font-size:13px;line-height:1.6;color:var(--text)}
.gd .k{display:inline-block;font-size:11px;background:var(--panel2);border-radius:6px;padding:1px 7px;margin-left:6px;color:var(--sub)}
.mk{display:flex;gap:6px;align-items:center;margin:4px 0}
.mk button.go{flex:1;text-align:left;padding:7px 10px;font-size:13px}
a{color:#7fb0ff}
#viewer{position:fixed;inset:0;background:#000e;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#viewer img{max-width:100%;max-height:72%;border-radius:8px}
#toast{position:fixed;left:50%;top:calc(var(--safe-t) + 64px);transform:translateX(-50%);background:#000d;color:#fff;border-radius:20px;padding:10px 16px;font-size:13px;z-index:60;display:none;max-width:86%;text-align:center}
#lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#lock .lt{font-size:20px;font-weight:700}
#lock .dots{font-size:26px;letter-spacing:10px;height:34px}
#lock .pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px}
#lock .pad button{height:76px;border-radius:38px;font-size:26px;padding:0}
.big{font-size:15px;padding:13px 14px}
.sbar{position:sticky;bottom:calc(-1 * (var(--safe-b) + 20px));margin:12px -16px calc(-1 * (var(--safe-b) + 20px));padding:10px 16px calc(var(--safe-b) + 14px);background:var(--panel);border-top:1px solid var(--line);z-index:3}
.gd p{margin:0 0 10px}
.sbar button{padding:8px 12px;font-size:14px}
.sbar{gap:6px}
</style>
</head>
<body>

<div id="vList" class="view on">
  <header><h1>BJJフロー</h1><button id="btnSearch">🔍</button><button id="btnNew" class="primary">＋ 新規</button></header>
  <div id="list"></div>
</div>

<div id="vBoard" class="view">
  <header>
    <button id="btnBack">‹ 戻る</button>
    <h1 id="boardTitle"></h1>
    <button id="btnUndo" title="元に戻す">↶</button>
    <button id="btnLock" title="閲覧ロック">🔓</button>
    <button id="btnBoardMenu">⋯</button>
  </header>
  <div id="canvas">
    <div id="banner"></div>
    <div id="world"><svg id="edges"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab3c5"/></marker></defs><g id="edgeG"></g></svg><div id="nodes"></div></div>
    <button id="fit">全体表示</button>
    <button id="fab" class="primary">＋ 技を追加</button>
  </div>
</div>

<div id="shade"></div>
<div id="sheet"></div>
<div id="viewer"></div>
<div id="toast"></div>
<div id="lock"></div>
<input type="file" id="fileAny" hidden>

<script src="glossary.js"></script>
<script src="app.js"></script>
<script>
(function () {
  if (window.__ver_app !== 5 || window.__ver_gloss !== 5) {
    document.body.innerHTML = '<div style="padding:30px;line-height:1.8;font-size:16px">ファイルの更新が途中のようです。<br>GitHubに、zipの中の<b>すべてのファイル</b>（index.html / app.js / glossary.js / sw.js / manifest.webmanifest / アイコン2つ）をアップロードし直してください。<br><br>1〜2分待ってから、ページを開き直してください。</div>';
  }
})();
</script>
</body>
</html>
