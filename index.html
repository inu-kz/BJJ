<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BJJフロー">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>BJJフロー</title>
<style>
:root{color-scheme:light dark;
--bg:#F2F2F7;--card:#fff;--sheet-bg:#F2F2F7;--sheet-grp:#fff;--fill:rgba(118,118,128,.12);--fill2:rgba(120,120,128,.16);
--label:#000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.22);
--tint:#007AFF;--tint-soft:rgba(0,122,255,.1);--danger:#FF3B30;--danger-soft:rgba(255,59,48,.1);--ok:#34C759;--warn:#FF9500;
--dot:rgba(60,60,67,.13);--bar:rgba(249,249,249,.88);--shadow:0 .5px 1px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.06);--nline:transparent;--edge:rgba(60,60,67,.38);--seg-on:#fff;
--k-pos:#007AFF;--k-sweep:#34C759;--k-pass:#30B0C7;--k-sub:#FF3B30;--k-esc:#FF9500;--k-td:#5856D6;--k-etc:#8E8E93;
--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
@media (prefers-color-scheme:dark){:root{
--bg:#000;--card:#1C1C1E;--sheet-bg:#1C1C1E;--sheet-grp:#2C2C2E;--fill:rgba(118,118,128,.24);--fill2:rgba(120,120,128,.36);
--label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.28);--sep:rgba(84,84,88,.6);
--tint:#0A84FF;--tint-soft:rgba(10,132,255,.18);--danger:#FF453A;--danger-soft:rgba(255,69,58,.16);--ok:#30D158;--warn:#FF9F0A;
--dot:rgba(235,235,245,.1);--bar:rgba(22,22,24,.86);--shadow:none;--nline:rgba(255,255,255,.08);--edge:rgba(235,235,245,.36);--seg-on:#636366;
--k-pos:#0A84FF;--k-sweep:#30D158;--k-pass:#40C8E0;--k-sub:#FF453A;--k-esc:#FF9F0A;--k-td:#5E5CE6;--k-etc:#98989D}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;font-size:17px;letter-spacing:-.01em;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--tint);text-decoration:none}
.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.view{position:fixed;inset:0;display:none;flex-direction:column}.view.on{display:flex}

/* タブ */
.tab{position:absolute;inset:0;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}.tab.on{display:block}
.tabpad{height:calc(var(--sb) + 96px)}
#tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:7px 0 calc(var(--sb) + 4px);z-index:10}
#tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:#8E8E93}
#tabbar button .i{width:25px;height:25px}
#tabbar button.on{color:var(--tint)}
.ltbar{display:flex;align-items:center;gap:4px;height:44px;margin-top:var(--st);padding:0 8px}
.sp{flex:1}
.nb{color:var(--tint);font-size:17px;padding:8px 10px}
.nb.ic{width:40px;height:40px;display:flex;align-items:center;justify-content:center;padding:0}
.nb.ic .i{width:24px;height:24px}
h1.lt{font-size:34px;font-weight:700;letter-spacing:.01em;margin:2px 20px 14px}

/* リスト */
.grp{background:var(--card);border-radius:10px;margin:0 16px 26px;overflow:hidden}
.sh{font-size:13px;color:var(--label2);margin:0 32px 7px;letter-spacing:0}
.sf{font-size:13px;color:var(--label2);margin:-18px 32px 26px;line-height:1.45}
.cell{display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 16px;position:relative;color:var(--label);text-align:left;width:100%}
.cell+.cell::before,.vrow+.vrow::before,.lrow+.lrow::before,.vrow+.cell::before,.lrow+.cell::before,.lrow+.inp::before{content:'';position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.vrow,.lrow{position:relative}
.grp>.cell:has(.ib)+.cell::before,.grp>.cell:has(.sq)+.cell::before{left:56px}
.grp.th>.cell+.cell::before{left:72px}
.cell.tap:active{background:var(--fill)}
.cl{flex:1;min-width:0}
.ct{font-size:17px;line-height:1.3;overflow:hidden;text-overflow:ellipsis}
.cs{font-size:13px;color:var(--label2);margin-top:2px;display:flex;align-items:center;gap:5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cell.tall .cs{white-space:normal;display:block;line-height:1.4}
.cd{font-size:17px;color:var(--label2);white-space:nowrap}
.chev{color:var(--label3)}.chev .i{width:17px;height:17px;stroke-width:2.4}
.ib{color:var(--tint);width:28px;display:flex;justify-content:center}
.sq{width:29px;height:29px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}.sq .i{width:18px;height:18px;stroke-width:2}
.act .ct{color:var(--tint)}.act.danger .ct{color:var(--danger);text-align:center}.act.danger .cl{text-align:center}
.cell.muted .ct{color:var(--label2);font-size:15px}
.lk .i{width:15px;height:15px;display:inline-block;vertical-align:-2px;margin-right:4px;color:var(--label2)}
.en{color:var(--label2);font-weight:400;font-size:15px;margin-left:6px}
.red{color:var(--danger)}
.kd{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}.kd.lg{width:10px;height:10px}
.ms{width:11px;height:11px;border-radius:50%;border:1.6px solid var(--label3);flex:none;display:inline-block}
.ms.m1{border-color:var(--warn);background:linear-gradient(90deg,var(--warn) 50%,transparent 50%)}
.ms.m2{border-color:var(--ok);background:var(--ok)}
.thb{width:44px;height:44px;border-radius:9px;background:var(--fill);flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px;overflow:hidden}
.thb.sm{width:34px;height:34px;border-radius:7px;font-size:15px}
.thb img{width:100%;height:100%;object-fit:cover;display:block}
.ibtn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--label2);border-radius:17px}
.ibtn:active{background:var(--fill)}
.vplay{color:var(--tint)}
.search{display:flex;align-items:center;gap:6px;margin:0 16px 12px;height:36px;padding:0 8px;background:var(--fill);border-radius:10px;color:var(--label2)}
.search .i{width:18px;height:18px}
.search input{flex:1;border:0;background:transparent;font:inherit;font-size:17px;color:var(--label);outline:none;-webkit-user-select:text;user-select:text;min-width:0}
.search.in{margin:4px 16px 18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 18px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 13px;border-radius:16px;background:var(--fill);font-size:15px}
.chip.on{background:var(--label);color:var(--bg);font-weight:600}
.empty{padding:36px 36px 20px;text-align:center;color:var(--label2);font-size:15px;line-height:1.55}
.empty h2{color:var(--label);font-size:20px;font-weight:600;margin:0 0 8px}
.empty.sm{padding:20px 36px}
.empty p{margin:0 0 18px}
.ver{text-align:center;color:var(--label3);font-size:13px;margin:-8px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 16px 26px}
.stat{background:var(--card);border-radius:10px;padding:12px 14px}
.sv{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.sl{font-size:13px;color:var(--label2);display:flex;align-items:center;gap:6px;margin-top:2px}

/* ボタン */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:8px 14px;font-size:15px;font-weight:600;background:var(--tint-soft);color:var(--tint);white-space:nowrap}
.btn .i{width:18px;height:18px}
.btn.solid{background:var(--tint);color:#fff}
.btn.gray{background:var(--fill);color:var(--label)}
.btn.red{background:var(--danger-soft);color:var(--danger)}
.btn.sm{padding:5px 12px;font-size:14px;border-radius:14px}
.btn.lg{padding:14px 24px;font-size:17px;border-radius:14px;flex:1}
.btn:active{opacity:.6}
.bt-row{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;align-items:center}
.bt-row.c{justify-content:center}
.bt-row.tight{padding:4px 0 8px}
.bt-row.in{padding:0 16px 12px 56px}
.pad{padding:12px 16px}

/* 入力 */
.inp{display:block;width:100%;border:0;background:transparent;font:inherit;font-size:17px;color:var(--label);padding:12px 16px;outline:none;-webkit-user-select:text;user-select:text;border-radius:0}
.inp::placeholder{color:var(--label3)}
.inp+.inp{border-top:.5px solid var(--sep)}
.inp.r{text-align:right;padding:0;flex:1.4}
.inp.big{font-size:24px;font-weight:700;padding:16px 16px 4px}
.inp.en{font-size:15px;color:var(--label2);padding:0 16px 14px;border-top:0}
.inp.memo{min-height:130px;resize:none;line-height:1.5}
.inp:disabled{opacity:1;color:var(--label)}
.lbl{color:var(--label)}
.sel{appearance:none;-webkit-appearance:none;border:0;background:transparent;font:inherit;font-size:17px;color:var(--label2);text-align:right;outline:none;max-width:62%}
.hero .cell{border-top:.5px solid var(--sep)}
.sw{width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;flex:none;transition:background .2s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.06);transition:transform .22s}
.sw.on{background:var(--ok)}.sw.on::after{transform:translateX(20px)}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px}
.seg button{flex:1;font-size:13px;font-weight:500;padding:6px 8px;border-radius:7px;line-height:1.3}
.seg button.on{background:var(--seg-on);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
.seg.sm button{padding:5px 4px}

/* ポジションの図 */
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:calc(44px + var(--st));padding:var(--st) 6px 0;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);z-index:5}
.navb{display:flex;align-items:center;gap:2px;color:var(--tint);font-size:17px;padding:8px 6px;max-width:100%;overflow:hidden;white-space:nowrap}
.navb span{overflow:hidden;text-overflow:ellipsis}
.navb .i{width:24px;height:24px;stroke-width:2.2;margin-left:-4px}
.navt{font-size:17px;font-weight:600;max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.navr{justify-self:end;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--tint)}
.segwrap{padding:2px 16px 10px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep);z-index:5}
.segwrap .seg{max-width:300px;margin:0 auto}
#canvas{flex:1;position:relative;overflow:hidden;touch-action:none;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.4px);background-size:22px 22px}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
.edge{fill:none;stroke:var(--edge);stroke-width:1.6}.edge.dash{stroke-dasharray:6 5}
.ehit{fill:none;stroke:transparent;stroke-width:24}
.elbl{font-size:12px;fill:var(--label2);paint-order:stroke;stroke:var(--bg);stroke-width:6px;stroke-linejoin:round;text-anchor:middle;pointer-events:none;font-weight:500}
.far .elbl{display:none}
.node{position:absolute;width:184px;background:var(--card);border-radius:13px;box-shadow:var(--shadow);border:.5px solid var(--nline);padding:11px 12px 10px;touch-action:none;-webkit-touch-callout:none;transition:opacity .2s}
.nh{display:flex;gap:10px;align-items:flex-start}
.nthumb{width:40px;height:40px;border-radius:8px;object-fit:cover;flex:none;background:var(--fill);pointer-events:none;-webkit-user-drag:none}
.nt{flex:1;min-width:0;padding-right:10px}
.ttl{font-size:15px;font-weight:600;line-height:1.3;word-break:break-word}
.meta{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:12px;color:var(--label2)}
.meta .i{width:13px;height:13px;stroke-width:1.9}
.meta span{margin-right:3px}
.node>.ms{position:absolute;top:11px;right:11px;width:10px;height:10px}
.goto{display:flex;align-items:center;gap:5px;width:calc(100% + 24px);margin:10px -12px -10px;padding:9px 12px;border-top:.5px solid var(--sep);color:var(--tint);font-size:13px;font-weight:600;text-align:left;border-radius:0 0 13px 13px}
.goto .i{width:15px;height:15px;stroke-width:2.2}
.goto span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold{position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);height:24px;min-width:24px;padding:0 7px;border-radius:12px;background:var(--card);border:.5px solid var(--sep);box-shadow:0 1px 4px rgba(0,0,0,.1);color:var(--label2);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:2}
.fold .i{width:14px;height:14px;stroke-width:2.4}
.fold.c{background:var(--label);color:var(--bg);border-color:var(--label)}
.node.sel{box-shadow:0 0 0 2.5px var(--tint),var(--shadow)}
.node.from{box-shadow:0 0 0 2.5px var(--tint),var(--shadow);animation:pulse 1.2s ease infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--tint-soft),var(--shadow)}}
.node.dim{opacity:.14}.node.weak{opacity:.45}
.node.flash{animation:fl .6s ease 3}@keyframes fl{50%{box-shadow:0 0 0 5px var(--tint)}}
.far .meta,.far .nthumb{display:none}.far .ttl{font-size:18px;line-height:1.25}.far .goto{font-size:15px}
#banner{position:absolute;left:50%;transform:translateX(-50%);top:12px;background:var(--label);color:var(--bg);border-radius:18px;padding:8px 14px;font-size:13px;font-weight:600;display:none;z-index:4;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#emptyHint{position:absolute;left:0;right:0;top:34%;text-align:center;color:var(--label2);font-size:15px;line-height:1.6;pointer-events:none}
#emptyHint b{color:var(--label);font-weight:600}
#toolbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 16px);display:flex;align-items:center;gap:2px;padding:5px;border-radius:30px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 8px 28px rgba(0,0,0,.12),0 0 0 .5px var(--sep);z-index:4}
#toolbar button{width:46px;height:46px;border-radius:23px;display:flex;align-items:center;justify-content:center;color:var(--label)}
#toolbar button:active{background:var(--fill)}
#toolbar button.off{color:var(--label3)}
#toolbar button.on{color:var(--tint)}
#toolbar #tAdd{background:var(--tint);color:#fff;width:52px;height:52px;border-radius:26px;margin:0 4px}
#toolbar #tAdd .i{width:26px;height:26px;stroke-width:2.2}

/* シート */
#shade{position:fixed;inset:0;background:rgba(0,0,0,.3);display:none;z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--sheet-bg);border-radius:14px 14px 0 0;display:none;z-index:21;padding-bottom:calc(var(--sb) + 28px);-webkit-overflow-scrolling:touch;overscroll-behavior:contain;box-shadow:0 -1px 0 var(--sep)}
#sheet .grp{background:var(--sheet-grp)}
.shd{position:sticky;top:0;z-index:6;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px 8px 12px;background:var(--sheet-bg)}
.grab{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:36px;height:5px;border-radius:3px;background:var(--label3)}
.shd .t{font-size:17px;font-weight:600;text-align:center;max-width:56vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb{color:var(--tint);font-size:17px;padding:6px 10px;display:flex;align-items:center;gap:2px}
.tb.r{justify-self:end;font-weight:600}.tb.l{justify-self:start}
.tb .i{width:22px;height:22px;stroke-width:2.2;margin-left:-4px}
.sbd{padding-top:6px}
.cv{border-radius:12px}
.cover{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--fill)}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.pg img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--fill)}
.gl{padding:12px 16px;position:relative}
.gl+.gl::before{content:'';position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.glh{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 0}
.glh b{font-weight:600}
.tag{font-size:12px;font-weight:600;margin-left:auto;padding-left:8px}
.gd{font-size:15px;line-height:1.55;margin:8px 0 0;color:var(--label)}
.gl .bt-row{padding:10px 0 0}
.gl:not(.open){cursor:pointer}
.phost video{width:100%;max-height:46vh;display:block;background:#000}
.lplay iframe{width:100%;aspect-ratio:16/9;border:0;display:block;background:#000}
.mk{display:flex;align-items:center;gap:4px}
.mgo{flex:1;text-align:left;padding:8px 0;font-size:15px;display:flex;gap:10px;align-items:baseline}
.tm{color:var(--tint);font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;min-width:42px}
.pl{font-size:13px;color:var(--label2)}
.lmks:empty{display:none}
.help{padding:0 22px 10px;font-size:15px;line-height:1.65}
.help h3{font-size:17px;font-weight:600;margin:18px 0 4px}
.help p{margin:0;color:var(--label)}
.help .note{color:var(--label2);font-size:13px;margin-top:22px}
.qz{padding:8px 24px 20px;text-align:center}
.qm{font-size:13px;color:var(--label2)}
.qq{font-size:24px;font-weight:700;line-height:1.45;margin:22px 0 18px}
.qh{font-size:15px;color:var(--label2);line-height:1.5}
#viewer{position:fixed;inset:0;background:#000;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
#viewer img{max-width:100%;max-height:74%;border-radius:4px}
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 92px);transform:translateX(-50%);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:var(--label);border-radius:22px;padding:10px 18px;font-size:14px;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.14),0 0 0 .5px var(--sep);z-index:60;display:none;max-width:88%;text-align:center;line-height:1.4}
#lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.lt2{font-size:22px;font-weight:700}
.lmsg{font-size:15px;color:var(--label2);height:20px}
.dots{display:flex;gap:18px;margin:6px 0 18px}.dots i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--label)}.dots i.on{background:var(--label)}
#lock .pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px;padding:0}
#lock .pad button{width:78px;height:78px;border-radius:39px;background:var(--fill);font-size:32px;font-weight:400}
#lock .pad button.del{background:transparent}
#lock .pad button:active{background:var(--fill2)}

.navrs{justify-self:end;display:flex}
.i.xs{width:13px;height:13px;display:inline-block;vertical-align:-2px;stroke-width:2}

function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 2600); }

async function shareOrDownload(file) {
  try { if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; } }
  catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}

/* ---------- 端末内保存 (IndexedDB) ---------- */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('bjjflow', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('videos'); };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode);
      const req = fn(t.objectStore(store));
      t.oncomplete = () => res(req && req.result);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  },
  get: (s, k) => DB.tx(s, 'readonly', o => o.get(k)),
  put: (s, k, v) => DB.tx(s, 'readwrite', o => o.put(v, k)),
  del: (s, k) => DB.tx(s, 'readwrite', o => o.delete(k)),
  has: async (s, k) => (await DB.tx(s, 'readonly', o => o.getKey(k))) !== undefined,
  keys: s => new Promise((res, rej) => { const r = DB.db.transaction(s, 'readonly').objectStore(s).getAllKeys(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }),
};
async function putBlob(blob) { const k = uid(); await DB.put('videos', k, blob); return k; }
const urlCache = new Map();
async function blobUrl(key) {
  if (!key) return null;
  if (urlCache.has(key)) return urlCache.get(key);
  const b = await DB.get('videos', key); if (!b) return null;
  const u = URL.createObjectURL(b); urlCache.set(key, u); return u;
}

/* ---------- 画像・動画の下ごしらえ ---------- */
async function resizeImage(file, max = 1280) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ng) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ng; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
  } finally { URL.revokeObjectURL(url); }
}
function makePoster(blob) {
  return new Promise(res => {
    const url = URL.createObjectURL(blob), v = document.createElement('video'); let done = false;
    const fin = r => { if (done) return; done = true; v.remove(); URL.revokeObjectURL(url); res(r); };
    v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
    v.style.cssText = 'position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0;pointer-events:none';
    document.body.appendChild(v);
    setTimeout(() => fin(null), 7000);
    v.muted = true; v.playsInline = true; v.preload = 'auto'; v.onerror = () => fin(null);
    v.onloadedmetadata = () => { try { v.currentTime = Math.min(1, (isFinite(v.duration) && v.duration ? v.duration : 2) / 2); } catch { fin(null); } };
    v.onseeked = () => {
      try {
        const w = 320, h = Math.round(w * (v.videoHeight || 180) / (v.videoWidth || 320));
        const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(v, 0, 0, w, h);
        c.toBlob(b => fin(b), 'image/jpeg', 0.7);
      } catch { fin(null); }
    };
    v.src = url; try { v.load(); } catch { }
  });
}

function startQuiz() {

function quizNext(pool, st) {

  let r = Math.random() * w.reduce((a, b) => a + b, 0), pick = pool[0];
  for (let i = 0; i < pool.length; i++) { r -= w[i]; if (r <= 0) { pick = pool[i]; break; } }
  const e = pick.outs[Math.floor(Math.random() * pick.outs.length)];
  const answers = e.label ? pick.outs.filter(x => x.label === e.label) : pick.outs;
  const tgt = x => { const n = pick.Sd.nodes.find(n => n.id === x.to); return n && T(n.tid); };
  openSheet({ title: '復習クイズ', done: '終了', body: `<div class="qz"><div class="qm">${esc(pick.b.name)} ・ ${SIDE_LABEL[pick.s]}　　${st.n}問中 ${st.ok}問 正解</div>

/* ---------- 折りたたみ（見える技の計算） ---------- */
function visInfo(Sd) {
  const ids = Sd.nodes.map(n => n.id), out = new Map(ids.map(i => [i, []])), indeg = new Map(ids.map(i => [i, 0]));
  Sd.edges.forEach(e => { out.get(e.from).push(e.to); indeg.set(e.to, indeg.get(e.to) + 1); });
  const col = new Map(Sd.nodes.map(n => [n.id, n.collapsed]));
  const bfs = (starts, stop) => { const seen = new Set(starts), q = [...starts]; while (q.length) { const u = q.shift(); if (stop && col.get(u)) continue; for (const v of out.get(u)) if (!seen.has(v)) { seen.add(v); q.push(v); } } return seen; };
  let starts = ids.filter(i => !indeg.get(i));
  const all = bfs(starts, false); starts = starts.concat(ids.filter(i => !all.has(i)));
  const visible = bfs(starts, true), hidden = new Map();
  Sd.nodes.forEach(n => { if (n.collapsed) { let c = 0; bfs([n.id], false).forEach(v => { if (v !== n.id && !visible.has(v)) c++; }); hidden.set(n.id, c); } });
  return { visible, out, hidden };
}
function neighborSet(id) { const s = new Set([id]); SD().edges.forEach(e => { if (e.from === id) s.add(e.to); if (e.to === id) s.add(e.from); }); return s; }

const nodeEl = id => nodesEl.querySelector(`[data-id="${id}"]`);
function box(n) { const el = nodeEl(n.id), w = el ? el.offsetWidth : NW, h = el ? el.offsetHeight : 60; return { x: n.x, y: n.y, w, h, cx: n.x + w / 2, cy: n.y + h / 2 }; }

function ytInfo(u) {

    const x = new URL(/^https?:\/\//i.test(u.trim()) ? u.trim() : 'https://' + u.trim()), h = x.hostname.replace(/^(www|m|music)\./, '');
    let id = null;
    if (h === 'youtu.be') id = x.pathname.slice(1, 12);
    else if (h === 'youtube.com' || h === 'youtube-nocookie.com') {
      if (x.pathname === '/watch') id = x.searchParams.get('v');
      else { const m = x.pathname.match(/^\/(shorts|embed|live)\/([\w-]{11})/); if (m) id = m[2]; }
    }
    if (!id || !/^[\w-]{11}$/.test(id)) return null;
    const t = x.searchParams.get('t') || x.searchParams.get('start') || '0'; let start = 0;
    if (/^\d+$/.test(t)) start = +t; else { const m = t.match(/(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?/); start = (+m[1] || 0) * 3600 + (+m[2] || 0) * 60 + (+m[3] || 0); }
    return { id, start };

}

async function commonsSearch(q) {
  const strip = s => String(s || '').replace(/<[^>]*>/g, '').trim().slice(0, 60);
  const seen = new Set(), out = [];
  for (const t of [`${q} jiu-jitsu`, `${q} grappling`, q]) {
    const p = new URLSearchParams({ action: 'query', format: 'json', origin: '*', generator: 'search', gsrsearch: `${t} filetype:bitmap`, gsrnamespace: '6', gsrlimit: '12', prop: 'imageinfo', iiprop: 'url|mime|extmetadata', iiurlwidth: '640', iiextmetadatafilter: 'Artist|LicenseShortName' });
    const r = await fetch('https://commons.wikimedia.org/w/api.php?' + p); if (!r.ok) throw new Error('http ' + r.status);
    const j = await r.json();
    Object.values((j.query && j.query.pages) || {}).sort((a, b) => a.index - b.index).forEach(pg => {
      const ii = pg.imageinfo && pg.imageinfo[0];
      if (!ii || !/^image\/(jpeg|png|webp)/.test(ii.mime) || seen.has(pg.title)) return;
      seen.add(pg.title); const md = ii.extmetadata || {};
      out.push({ title: pg.title.replace(/^File:/, ''), thumb: ii.thumburl || ii.url, page: ii.descriptionurl, license: (md.LicenseShortName && md.LicenseShortName.value) || '', artist: strip(md.Artist && md.Artist.value) });
    });
    if (out.length >= 3) break;
  }
  return out.slice(0, 9);
}

    state = normalize3(state);
    if (board) board = state.boards.find(b => b.id === board.id) || null;
    await saveNow();
    const first = ctx.touched[0];
    openSheet({ title: '反映しました', body: `<div class="aihero">${icon('check')}<p>${on.size}件の変更を反映しました${ctx.fresh.length ? `（技を${ctx.fresh.length}つ配置）` : ''}。</p></div>
    <div class="grp">${first ? cell({ tap: true, attr: 'id="aiopen"', icon: 'map', title: `「${esc(first.b.name)}・${SIDE_LABEL[first.s]}」を開く`, cls: 'act' }) : ''}${cell({ tap: true, attr: 'id="aiundo"', icon: 'undo', title: '今の反映を取り消す', cls: 'act' })}</div>` });
    if (first) $('#aiopen').onclick = () => { closeSheet(); const same = board && board.id === first.b.id && $('#vBoard').classList.contains('on'); openBoard(first.b.id, same ? 'stay' : (board ? 'link' : 'fresh'), first.s); setTimeout(fitView, 40); };
    $('#aiundo').onclick = undoAI;
    if (board && $('#vBoard').classList.contains('on')) { renderBoard(); syncHeader(); }
  };
}
async function undoAI() {
  if (!lastAiUndo) return;
  const bid = board && board.id;
  state = migrate(JSON.parse(lastAiUndo)); lastAiUndo = null; await saveNow();
  board = bid ? state.boards.find(b => b.id === bid) || null : null;
  closeSheet(); if (board) { undoStack = []; renderBoard(); syncHeader(); } else { show('vTabs'); refreshTab(); }
  toast('取り消しました');
}

/* AIアプリから戻ったら、取り込み画面を開く */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  setTimeout(() => {
    let t = 0; try { t = +localStorage.getItem(AI_PENDING) || 0; } catch { }
    if (!t || Date.now() - t > 3 * 3600 * 1000 || lockedNow) return;
    if ($('#aipaste2') || $('#aiapply')) return;
    openAIImport(true);
  }, 400);
});
/* ================= バックアップ・読み込み・ロック・起動 ================= */
async function showBackups() {
  const list = (await DB.get('kv', 'backups')) || [];
  const cnt = d => { const m = d.techs ? Object.keys(d.techs).length : (d.boards || []).reduce((a, b) => a + ((b && b.nodes) || []).length, 0); return `ポジション ${(d.boards || []).length} ・ 技 ${m}`; };
  openSheet({ title: '自動バックアップ', body: (list.length ? '<div class="grp">' + list.map((b, i) => { const d = new Date(b.t); return cell({ attr: `data-i="${i}"`, title: `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}　${esc(b.label)}`, sub: cnt(b.data), right: '<button class="btn sm">復元</button>' }); }).join('') + '</div>' : '<div class="empty sm"><p>まだバックアップはありません。</p></div>') + '<div class="sf">構成・メモ・しおりを最大8件まで自動で残します。動画そのものは含まれません。復元すると今のデータは置き換わりますが、復元前の状態も1件残ります。</div>' });
  $$('#sheet [data-i] .btn').forEach(btn => btn.onclick = async () => {
    const b = list[+btn.closest('[data-i]').dataset.i];
    if (!confirm('このバックアップの状態に戻しますか？')) return;
    await snapshot('復元前の状態');
    state = migrate(JSON.parse(JSON.stringify(b.data))); await saveNow(); closeSheet(); board = null; show('vTabs'); refreshTab(); toast('復元しました');
  });
}

async function exportJson() {
  const st = JSON.parse(JSON.stringify(state));
  Object.values(st.techs).forEach(t => { t.videos = t.videos.map(v => ({ ...v, kind: 'ref', vid: null })); t.thumb = null; t.img = null; t.imgCredit = null; t.photos = []; });
  (st.journal || []).forEach(j => { j.audios = []; });
  await shareOrDownload(new File([JSON.stringify({ app: 'bjjflow', format: 3, state: st }, null, 1)], `bjjflow-${dateStr()}.json`, { type: 'application/json' }));
}
async function exportFull() {
  toast('書き出しを準備しています（動画が多いと時間がかかります）');
  const refs = new Set(); collectRefs(state, refs); const meta = [], parts = [];
  for (const k of refs) { const b = await DB.get('videos', k); if (b) { meta.push({ key: k, size: b.size, type: b.type }); parts.push(b); } }
  const header = new TextEncoder().encode(JSON.stringify({ app: 'bjjflow', format: 3, state, blobs: meta }));
  const len = new Uint8Array(4); new DataView(len.buffer).setUint32(0, header.length);
  await shareOrDownload(new File(['BJJBAK01', len, header, ...parts], `bjjflow-full-${dateStr()}.bjjbak`, { type: 'application/octet-stream' }));
}
function remapImported(st, remap) {
  Object.values(st.techs).forEach(t => {
    t.thumb = remap[t.thumb] || null; t.img = remap[t.img] || null; if (!t.img) t.imgCredit = null;
    t.photos = t.photos.map(p => remap[p]).filter(Boolean);
    t.videos = t.videos.map(v => { if (v.kind === 'copy') { if (remap[v.vid]) v.vid = remap[v.vid]; else { v.kind = 'ref'; delete v.vid; } } return v; });
  });
  const tmap = {}, bmap = {}, techs = {};
  Object.keys(st.techs).forEach(id => { tmap[id] = uid(); });
  st.boards.forEach(b => { bmap[b.id] = uid(); });
  Object.entries(st.techs).forEach(([id, t]) => { t.id = tmap[id]; t.counters = t.counters.map(c => tmap[c]).filter(Boolean); techs[t.id] = t; });
  st.techs = techs;
  st.boards.forEach(b => { b.id = bmap[b.id]; ['bottom', 'top'].forEach(s => b.sides[s].nodes.forEach(n => { n.tid = tmap[n.tid]; if (n.goto) n.goto.board = bmap[n.goto.board]; })); });
  st.journal.forEach(j => { j.id = uid(); j.techs = j.techs.map(c => tmap[c]).filter(Boolean); j.audios = j.audios.filter(a => remap[a.key]).map(a => ({ ...a, key: remap[a.key] })); });
  return st;
}
async function importAny(file) {
  const head = new Uint8Array(await file.slice(0, 12).arrayBuffer());
  const magic = new TextDecoder().decode(head.slice(0, 8)); let raw, remap = {}, nb = 0;
  if (magic === 'BJJBAK01') {
    const hl = new DataView(head.buffer, 8, 4).getUint32(0);
    const hdr = JSON.parse(await file.slice(12, 12 + hl).text());
    if (hdr.app !== 'bjjflow' || !hdr.state) throw new Error('形式が違います');
    if (!confirm(`${(hdr.state.boards || []).length}件のポジションと、画像・動画${hdr.blobs.length}個を、今のデータに追加します。`)) return;
    toast('読み込んでいます'); let off = 12 + hl;
    for (const b of hdr.blobs) { const nk = uid(); await DB.put('videos', nk, file.slice(off, off + b.size, b.type)); remap[b.key] = nk; off += b.size; nb++; }
    raw = hdr.state;
  } else {
    const d = JSON.parse(await file.text()); if (d.app !== 'bjjflow') throw new Error('形式が違います');
    raw = d.state || { boards: d.boards };
    if (!confirm(`${(raw.boards || []).length}件のポジションを、今のデータに追加します（動画は含まれません）。`)) return;
  }
  const st = remapImported(migrate(JSON.parse(JSON.stringify(raw))), remap);
  await snapshot('読み込み前の状態');
  Object.assign(state.techs, st.techs); state.boards.push(...st.boards); state.journal.push(...st.journal); state = normalize3(state);
  await saveNow(); closeSheet(); refreshTab(); toast('読み込みました');
}
async function wipeAll() {
  try { DB.db.close(); } catch { }
  await new Promise(r => { const q = indexedDB.deleteDatabase('bjjflow'); q.onsuccess = q.onerror = q.onblocked = () => r(); });
  location.reload();
}

/* ---------- 暗証番号ロック ---------- */
let pinBuf = '', pinFail = 0, pinBlock = 0, hiddenAt = 0, lockedNow = false;
async function sha256(s) { const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join(''); }
function drawDots() { const d = $('#ldots'); if (d) d.innerHTML = [0, 1, 2, 3].map(i => `<i class="${i < pinBuf.length ? 'on' : ''}"></i>`).join(''); }
function lockMsg(t) { const m = $('#lmsg'); if (m) m.textContent = t; }
function hideLock() { $('#lock').style.display = 'none'; $('#lock').innerHTML = ''; lockedNow = false; }
function showLock(cover) {
  const el = $('#lock'); el.style.display = 'flex';
  if (cover) { if (!lockedNow) el.innerHTML = ''; return; }
  lockedNow = true; pinBuf = '';
  el.innerHTML = `<div class="lt2">BJJフロー</div><div class="lmsg" id="lmsg">暗証番号を入力</div><div class="dots" id="ldots"></div>
  <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '', 0, 'del'].map(k => k === '' ? '<span></span>' : k === 'del' ? `<button class="del" data-k="del" aria-label="1文字消す">${icon('back')}</button>` : `<button data-k="${k}">${k}</button>`).join('')}</div>
  <button class="tb" id="lforget">暗証番号を忘れた場合</button>`;
  drawDots();
  $$('.pad button', el).forEach(b => b.onclick = () => pinKey(b.dataset.k));
  $('#lforget').onclick = async () => { if (confirm('暗証番号は復元できません。すべてのデータを消去してロックを解除しますか？') && confirm('本当にすべて消去しますか？')) await wipeAll(); };
}
async function pinKey(k) {
  if (Date.now() < pinBlock) { lockMsg(`あと${Math.ceil((pinBlock - Date.now()) / 1000)}秒お待ちください`); return; }
  if (k === 'del') pinBuf = pinBuf.slice(0, -1); else if (pinBuf.length < 4) pinBuf += k;
  drawDots();
  if (pinBuf.length === 4) {
    const h = await sha256(settings.pin.salt + pinBuf);
    if (h === settings.pin.hash) { pinFail = 0; hideLock(); }
    else { pinFail++; pinBuf = ''; drawDots(); if (pinFail >= 5) { pinBlock = Date.now() + 30000; pinFail = 0; lockMsg('5回まちがえました。30秒お待ちください'); } else lockMsg('暗証番号が違います'); }
  }
}
function pinSettings() {
  openSheet({ title: '暗証番号ロック', body: `<div class="grp">${cell({ title: '暗証番号ロック', right: sw('pon', !!settings.pin) })}</div>
  <div id="pset"></div>
  <div class="sf">アプリを開いたときと、1分以上ほかのアプリを使って戻ったときに4桁の番号を聞きます。画面を隠すだけで、データの暗号化ではありません。iPhone自体のロックで足りる場合は、使わなくてかまいません。番号を忘れると、すべてのデータを消去しないと解除できません。</div>` });
  const form = () => {
    $('#pset').innerHTML = `<div class="grp"><input class="inp" type="tel" id="p1" maxlength="4" inputmode="numeric" placeholder="新しい暗証番号（数字4桁）"><input class="inp" type="tel" id="p2" maxlength="4" inputmode="numeric" placeholder="もう一度入力"></div><div class="bt-row"><button class="btn solid" id="psave">設定する</button></div>`;
    $('#psave').onclick = async () => {
      const a = $('#p1').value.trim(), b = $('#p2').value.trim();
      if (!/^\d{4}$/.test(a)) { toast('数字4桁で入力してください'); return; } if (a !== b) { toast('2回の入力が一致しません'); return; }
      const salt = uid() + uid(); settings.pin = { salt, hash: await sha256(salt + a) }; await saveSettings(); closeSheet(); toast('暗証番号を設定しました');
    };
  };
  bindSwitch('pon', async v => {
    if (v) form();
    else { if (!confirm('暗証番号ロックをオフにしますか？')) { $('#pon').classList.add('on'); return; } delete settings.pin; await saveSettings(); $('#pset').innerHTML = ''; toast('オフにしました'); }
  });
}
document.addEventListener('visibilitychange', () => {
  if (!settings.pin) return;
  if (document.hidden) { hiddenAt = Date.now(); showLock(true); }
  else if (lockedNow || Date.now() - hiddenAt > 60000) showLock(false); else { hideLock(); }
});

/* ---------- 起動 ---------- */
$$('#tabbar button').forEach(b => b.onclick = () => showTab(b.dataset.t));
(async function init() {
  try {
    await DB.open();
    const raw = await DB.get('kv', 'state');
    state = raw && typeof raw === 'object' ? raw : { schema: 3, techs: {}, boards: [], journal: [] };
    settings = (await DB.get('kv', 'settings')) || {};
    if (settings.pin) showLock(false);
    await autoBackup();                 // 変換する前の状態を先に残す
    state = migrate(state); await saveNow();
    await gc();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  } catch (e) { alert('この環境では保存機能が使えません: ' + e); }
  showTab('pos');
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
})();
